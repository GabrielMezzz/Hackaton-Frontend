# Gitflow de despliegue de la WEB en GitHub Pages.
# Solo publica el frontend Angular. La API Node sigue en Vercel y se despliega
# con la integracion de Git de Vercel (no pasa por aqui).
# La app usa rutas con hash (withHashLocation), asi que no hace falta 404.html.
#
# Variable de repositorio en GitHub > Settings > Secrets and variables > Actions
# (pestana "Variables", no "Secrets"):
#   API_BASE_URL = https://tu-proyecto.vercel.app   (obligatoria)
#   BASE_HREF    = opcional. Solo si usas dominio propio; por defecto /<repo>/
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# solo un deploy a la vez, y el nuevo cancela al que sigue en cola
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Angular CLI 22 exige Node >= 22.22.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      # genera src/environments/environment.prod.ts con la URL de la API
      - name: Apuntar a la API de produccion
        run: node scripts/set-api-base.mjs "${{ vars.API_BASE_URL }}"

      # base-href debe incluir el subdirectorio del repo en Pages
      # (https://<usuario>.github.io/<repo>/). Con dominio propio va "/".
      - name: Compilar
        run: npm run build -- --base-href "${{ vars.BASE_HREF || format('/{0}/', github.event.repository.name) }}"
        working-directory: frontend

      # evita que Pages pase los archivos por Jekyll
      - name: Preparar artefacto
        run: touch dist/frontend/browser/.nojekyll
        working-directory: frontend

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4